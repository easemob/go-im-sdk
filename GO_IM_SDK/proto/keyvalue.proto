package easemob.pb;

option optimize_for = LITE_RUNTIME;

message KeyValue
{
	enum ValueType
	{
		BOOL   = 1;
		INT    = 2;
		UINT   = 3;
		LLINT  = 4;
		FLOAT  = 5;
		DOUBLE = 6;
		STRING = 7;
		JSON_STRING = 8;
	};

	optional string key = 1;

	optional ValueType type   = 2;
	oneof value
	{
		int64   varint_value  = 3;
		float   float_value   = 4;
		double  double_value  = 5;
		string  string_value  = 6;
	}
}
