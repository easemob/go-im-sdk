# Copy this file to a deployment-specific path and keep credentials out of it.
# Environment priority: GO_IM_SDK_TOKEN, GO_IM_SDK_TOKEN_FILE, token_file, token.
msync_host: "wss://msync.example.com:443/websocket"
rest_base: "https://rest.example.com:443/org/app"
app_key: "org#app"
user_id: ""

# Recommended: mount a 0600 secret file and set its path here, or set
# GO_IM_SDK_TOKEN_FILE. GO_IM_SDK_TOKEN is useful for short-lived environments.
token_file: ""
# Last-resort inline token. If non-empty, this YAML file must be mode 0600.
token: ""

domain: "easemob.com"
# Required stable device identity. Persist and reuse it after restart. Two
# concurrently online instances for the same user must use different values.
resource: "go-service-instance-01"
sdk_version: "4.0.0-go"
heartbeat_interval_seconds: 120
heartbeat_timeout_seconds: 240
disable_reconnect: false
connect_timeout_seconds: 15
send_timeout_seconds: 15
logout_timeout_seconds: 5
max_redirect_hops: 5
max_frame_bytes: 4194304
write_queue_size: 256
handler_timeout_seconds: 30
handler_max_attempts: 3
handler_concurrency: 4
# PROVISION 返回 token 过期时间后，提前多少秒告警（默认 300 秒）
token_expiry_warning_seconds: 300
